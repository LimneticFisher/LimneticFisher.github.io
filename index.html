    <!-- ====== 密码门 ====== -->
    <div id="auth-gate">
        <div class="auth-box">
            <div class="auth-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <p class="auth-hint">请输入访问密码</p>
            <div class="auth-input-row">
                <input type="password" id="auth-pass" placeholder="密码" autocomplete="off">
                <button id="auth-btn">进入</button>
            </div>
            <p id="auth-error" class="auth-error"></p>
        </div>
    </div>
    <script>
    // ===== 修改这里的哈希值来更换密码 =====
    // 当前密码: "limneticfisher" 的 SHA-256 哈希
    // 更换密码方法: 在浏览器控制台运行:
    //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('你的新密码')).then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
    // 把输出的哈希值替换下面的字符串即可
    var AUTH_HASH = 'c8bff3c7ab6daea56b1e521d0e8172b33fca607e5b98e950c978a3b26be62a10';

    (function(){
        var KEY = 'site_auth_token';
        var COOKIE_DAYS = 365; // cookie 保存天数
        var gate = document.getElementById('auth-gate');

        // 读取 cookie
        function getCookie(name) {
            var match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            return match ? match[2] : null;
        }

        // 写入 cookie（跨所有路径）
        function setCookie(name, value, days) {
            var d = new Date();
            d.setTime(d.getTime() + days * 86400000);
            document.cookie = name + '=' + value + ';expires=' + d.toUTCString() + ';path=/;SameSite=Lax';
        }

        // 检查是否已验证：localStorage 或 cookie 任一命中即放行
        var authed = false;
        try { authed = localStorage.getItem(KEY) === AUTH_HASH; } catch(e) {}
        if (!authed) authed = getCookie(KEY) === AUTH_HASH;

        if (authed) {
            gate.style.display = 'none';
            // 双写确保两边都有
            try { localStorage.setItem(KEY, AUTH_HASH); } catch(e) {}
            setCookie(KEY, AUTH_HASH, COOKIE_DAYS);
        }

        async function sha256(str) {
            var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
            return [...new Uint8Array(buf)].map(function(x){return x.toString(16).padStart(2,'0')}).join('');
        }

        async function tryAuth() {
            var input = document.getElementById('auth-pass');
            var hash = await sha256(input.value);
            if (hash === AUTH_HASH) {
                // 双写 localStorage + cookie
                try { localStorage.setItem(KEY, AUTH_HASH); } catch(e) {}
                setCookie(KEY, AUTH_HASH, COOKIE_DAYS);
                gate.style.opacity = '0';
                setTimeout(function(){ gate.style.display = 'none'; }, 300);
            } else {
                var err = document.getElementById('auth-error');
                err.textContent = '密码错误，请重试';
                input.value = '';
                input.focus();
            }
        }

        document.getElementById('auth-btn').addEventListener('click', tryAuth);
        document.getElementById('auth-pass').addEventListener('keydown', function(e){
            if (e.key === 'Enter') tryAuth();
        });
    })();
    </script>
