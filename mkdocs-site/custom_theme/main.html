<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config.site_name }}</title>
    <link rel="stylesheet" href="{{ base_url }}/css/style.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <a href="{{ nav.homepage.url|url }}" class="header-brand">{{ config.site_name }}</a>

            <div class="header-right-controls">
                <button type="button" id="theme-toggle" title="切换日间/夜间模式">
                    <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg id="icon-moon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>

                <nav class="header-nav">
                    <ul>
                       {% for nav_item in nav %}
                        <li class="{% if nav_item.active %}active{% endif %}">
                           <a href="{{ nav_item.url|url }}">{{ nav_item.title }}</a>
                        </li>
                       {% endfor %}
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content">
        {% if page.is_homepage %}
        {{ page.content }}

        <footer class="footer">
            <div class="container">
                <p>&copy; 2025 您的名字. 版权所有.</p>
            </div>
        </footer>

        {% else %}
        <div class="page-content-wrapper">
            {{ page.content }}
        </div>
        {% endif %}
    </main>

    <script>var base_url = '{{ base_url }}';</script>
    <script src="{{ base_url }}/js/main.js" defer></script>
</body>
</html>
